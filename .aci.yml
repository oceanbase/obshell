version: "2.0"

only:
  triggerType:
    - pullRequest
    - tagPush
    - push

stages:
  - 合规扫描
  - 代码检查


jobs:
  Header 扫描:
    stage: 合规扫描
    component: shell-with-clone
    inputs:
      script: |
        #!/bin/bash
        TARGET_DIR="${BASE_WORKSPACE}"
        echo "$TARGET_DIR"

        COPYRIGHT_TEXT=$'/*\n'
        COPYRIGHT_TEXT+=$' * Copyright (c) 2024 OceanBase.\n'
        COPYRIGHT_TEXT+=$' *\n'
        COPYRIGHT_TEXT+=$' * Licensed under the Apache License, Version 2.0 (the "License");\n'
        COPYRIGHT_TEXT+=$' * you may not use this file except in compliance with the License.\n'
        COPYRIGHT_TEXT+=$' * You may obtain a copy of the License at\n'
        COPYRIGHT_TEXT+=$' *\n'
        COPYRIGHT_TEXT+=$' *     http://www.apache.org/licenses/LICENSE-2.0\n'
        COPYRIGHT_TEXT+=$' *\n'
        COPYRIGHT_TEXT+=$' * Unless required by applicable law or agreed to in writing, software\n'
        COPYRIGHT_TEXT+=$' * distributed under the License is distributed on an "AS IS" BASIS,\n'
        COPYRIGHT_TEXT+=$' * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n'
        COPYRIGHT_TEXT+=$' * See the License for the specific language governing permissions and\n'
        COPYRIGHT_TEXT+=$' * limitations under the License.\n'
        COPYRIGHT_TEXT+=$' */'

        non_compliant_files=()

        temp_file=$(mktemp)
        find "$TARGET_DIR" -type f -name "*.go" > "$temp_file"
        while IFS= read -r file; do
            start_of_file=$(head -n 15 "$file") 
            if [[ "$start_of_file" != "$COPYRIGHT_TEXT" ]]; then
                non_compliant_files+=("$file")
            fi
        done < "$temp_file"

        rm "$temp_file"

        if [ ${#non_compliant_files[@]} -ne 0 ]; then
            echo -e "\033[31mError: The following files are missing the correct copyright header:\033[0m"
            for file in "${non_compliant_files[@]}"; do
                echo -e "\033[31m${file}\033[0m"
            done
            exit 1
        else
            echo "All files have the correct copyright header."
        fi

        exit 0

  编译检查:
    stage: 代码检查
    component: shell-with-clone
    inputs:
      script: |
        #!/bin/bash
        set -euo pipefail
        if [[ `uname -m` == aarch64 ]]; then
          wget https://mirrors.aliyun.com/golang/go1.24.1.linux-arm64.tar.gz --no-check-certificate
          rm -rf /usr/local/go 
          tar -C /usr/local -xzf go1.24.1.linux-arm64.tar.gz
          cp /usr/local/go/bin/go /usr/local/bin/
        else
          wget https://mirrors.aliyun.com/golang/go1.24.1.linux-amd64.tar.gz --no-check-certificate
          rm -rf /usr/local/go 
          tar -C /usr/local -xzf go1.24.1.linux-amd64.tar.gz
          cp /usr/local/go/bin/go /usr/local/bin/
        fi
        export PATH=/usr/local/go/bin:$PATH
        go env -w GOPROXY=https://goproxy.cn GOPATH="/usr/local"
        go install github.com/go-bindata/go-bindata/...@v3.1.2+incompatible
        cd "${BASE_WORKSPACE}/codeWorkspace"
        mkdir -p seekdb/frontend/dist
        mkdir -p ob/frontend/dist
        touch seekdb/frontend/dist/index.html
        touch ob/frontend/dist/index.html
        make pre-build build-with-swagger

        # Run the complete affected test packages first. The real-RPM tests
        # below are additive and may use an internal artifact URL injected by
        # the CI environment instead of the public defaults.
        go test -vet=off -count=1 ./rpm/... ./ob/agent/lib/pkg ./ob/agent/executor/ob
        command -v xzcat >/dev/null || command -v unxz >/dev/null

        download_and_verify_rpm() {
          local url="$1"
          local path="$2"
          local sha256="$3"
          if command -v curl >/dev/null; then
            curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --output "$path" "$url"
          else
            wget --tries=3 --timeout=30 --waitretry=5 -O "$path" "$url"
          fi
          echo "${sha256}  ${path}" | sha256sum -c -
        }

        run_real_rpm_tests() {
          export OBSHELL_SIGNED_RPM_TEST_PATH="$1"
          go test -vet=off -count=1 -run '^(TestVerifyRealObshellReleaseRpm|TestInstallRealObshellReleaseRpm|TestInstallRejectsUnexpectedObshellVersion|TestInstallRealObshellSnapshotIgnoresSourceRewrite)$' ./ob/agent/lib/pkg
          go test -vet=off -count=1 -run '^(TestVerifyRealObshellUpgradeRpm|TestInstallNewAgentGetParamsRestoresLegacyTask)$' ./ob/agent/executor/ob
        }

        EL7_RPM_PATH="${BASE_WORKSPACE}/obshell-4.5.0.0-12026050816.el7.x86_64.rpm"
        EL7_RPM_URL="${OBSHELL_SIGNED_RPM_EL7_URL:-https://mirrors.aliyun.com/oceanbase/community/stable/el/7/x86_64/obshell-4.5.0.0-12026050816.el7.x86_64.rpm}"
        download_and_verify_rpm "$EL7_RPM_URL" "$EL7_RPM_PATH" "474c6fdf35e83633cd6515ddf8ab75d812a895ec98dc16a2a318e2834964e948"
        run_real_rpm_tests "$EL7_RPM_PATH"

        EL8_RPM_PATH="${BASE_WORKSPACE}/obshell-4.5.0.0-12026050816.el8.aarch64.rpm"
        EL8_RPM_URL="${OBSHELL_SIGNED_RPM_EL8_URL:-https://mirrors.aliyun.com/oceanbase/community/stable/el/8/aarch64/obshell-4.5.0.0-12026050816.el8.aarch64.rpm}"
        download_and_verify_rpm "$EL8_RPM_URL" "$EL8_RPM_PATH" "b612e0e70f8fbea79c1c98def5580a410a58bde8897625f55b138ebc69350b71"
        run_real_rpm_tests "$EL8_RPM_PATH"
  
  规范检查:
    stage: 代码检查
    component: golang-sast
    inputs:
      excludes:
        - "**_test.go**"
    config:
      execute:
        timeout: 600
      afterExecute:
        checkRule:
          - ${{outputs.critical}} <= 10
